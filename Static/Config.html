<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup - WebDAV Manager</title>
<style>
*{box-sizing:border-box;font-family:Inter,Roboto,Arial,sans-serif}
body{background:#0f172a;color:#e2e8f0;margin:0;padding:12px;min-height:100vh}
.card{max-width:820px;margin:0 auto;background:#1e293b;padding:20px;border-radius:16px;border:1px solid #334155}
h1{margin:0 0 6px;font-size:20px}
.sub{color:#94a3b8;font-size:12px;margin-bottom:12px;line-height:1.4}
label{display:block;margin:12px 0 5px;font-size:12px;color:#cbd5e1;font-weight:700}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{width:100%;padding:12px;background:#38bdf8;color:#000;border:none;border-radius:10px;font-weight:800;margin-top:16px;cursor:pointer;font-size:14px}
.btn2{padding:8px 12px;background:#334155;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
.tabBar{display:flex;gap:6px;margin:12px 0 16px;overflow-x:auto}
.tabBar button{padding:8px 14px;border-radius:20px;border:1px solid #334155;background:#0f172a;color:#94a3b8;white-space:nowrap;font-size:12px;cursor:pointer}
.tabBar button.active{background:#38bdf8;color:#000;font-weight:800}
.tab{display:none}.tab.active{display:block}
small{color:#64748b;font-size:11px}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;background:#0f172a;border:1px solid #334155;font-size:11px;color:#38bdf8}
</style>
</head>
<body>
<div class="card">
<h1>⚙️ WebDAV Manager Setup</h1>
<div class="sub">Username, Password, Port, Folder, Tailscale IP, Router FTP, UI Theme<br><span class="badge" id="tsInfo">Detecting Tailscale...</span></div>

<div class="tabBar">
<button class="active" id="b-basic" onclick="showTab('basic')">Basic</button>
<button id="b-auth" onclick="showTab('auth')">Login & Port</button>
<button id="b-router" onclick="showTab('router')">Router FTP</button>
<button id="b-ui" onclick="showTab('ui')">UI & Theme</button>
</div>

<div id="tab-basic" class="tab active">
<label>Server Mode</label>
<select id="server_mode"><option value="mobile">Mobile Storage</option><option value="router_ftp">Router FTP</option></select>
<label>Mobile Shared Folder</label>
<input id="mobile_path" value="/storage/emulated/0">
<small>Must exist, e.g. /storage/emulated/0/Download</small>
<label>Listen Address - Keep 0.0.0.0 for Tailscale same-mobile</label>
<input id="listen_addr" value="0.0.0.0">
<label>Listen Port</label>
<input id="listen_port" value="8080">
</div>

<div id="tab-auth" class="tab">
<label>WebDAV Username</label>
<input id="wd_user" value="admin" placeholder="admin">
<label>WebDAV Password - Required</label>
<input id="wd_pass" type="text" value="admin123" placeholder="Set password">
<small>Login for file access</small>
<label>Tailscale IP - Auto detect</label>
<input id="ts_ip" placeholder="100.x.x.x auto">
<div style="margin-top:8px"><button class="btn2" onclick="detectTS()">↻ Detect Tailscale IP</button> <span id="tsShow" style="font-size:12px;color:#38bdf8"></span></div>
</div>

<div id="tab-router" class="tab">
<label>Router FTP Host</label>
<input id="ftp_host" placeholder="192.168.1.1 or 192.168.29.1">
<div class="row"><div><label>FTP User</label><input id="ftp_user" placeholder="admin"></div><div><label>FTP Password</label><input id="ftp_pass" type="text"></div></div>
<label>FTP Port</label>
<input id="ftp_port" value="21">
</div>

<div id="tab-ui" class="tab">
<label>UI Type - Google Drive fixes full-screen</label>
<select id="ui_type">
<option value="google_drive">Google Drive - Full Screen</option>
<option value="openlist">OpenList - Full Screen List</option>
<option value="nas_admin">NAS Admin - Dark Full</option>
<option value="windows11">Windows 11 - Full</option>
<option value="mobile_app">Mobile App - Bottom Nav</option>
<option value="minimal">Minimal</option>
</select>
<label>Theme</label>
<select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="synology">Synology Dark</option><option value="windows">Windows Light</option></select>
<label>Icon Pack</label>
<select id="icon_pack"><option value="material">Material</option><option value="fluent">Fluent</option><option value="emoji">Emoji</option></select>
<div class="row" style="margin-top:10px">
<div><label>Preview</label><select id="feat_preview"><option value="true">ON</option><option value="false">OFF</option></select></div>
<div><label>Search</label><select id="feat_search"><option value="true">ON</option><option value="false">OFF</option></select></div>
</div>
</div>

<button class="btn" onclick="save()">💾 Save All & Restart</button>
<div id="status" style="margin-top:12px;font-size:12px;color:#94a3b8;text-align:center">Loading config...</div>
</div>

<script>
let cfg={};
function showTab(n){
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.querySelectorAll('.tabBar button').forEach(b=>b.classList.remove('active'));
 document.getElementById('tab-'+n).classList.add('active');
 document.getElementById('b-'+n).classList.add('active');
}
async function load(){
 try{
  const r=await fetch('/api/config'); cfg=await r.json();
  document.getElementById('mobile_path').value=cfg.mobile_path||'/storage/emulated/0';
  document.getElementById('server_mode').value=cfg.server_mode||'mobile';
  document.getElementById('listen_addr').value=cfg.listen_addr||'0.0.0.0';
  document.getElementById('listen_port').value=cfg.listen_port||'8080';
  document.getElementById('wd_user').value=(cfg.wd_auth&&cfg.wd_auth.user)||'admin';
  document.getElementById('wd_pass').value=(cfg.wd_auth&&cfg.wd_auth.pass)||'admin123';
  document.getElementById('ui_type').value=cfg.ui_type||'google_drive';
  document.getElementById('theme').value=cfg.theme||'light';
  document.getElementById('icon_pack').value=cfg.icon_pack||'material';
  document.getElementById('ftp_host').value=(cfg.router_ftp&&cfg.router_ftp.host)||'';
  document.getElementById('ftp_user').value=(cfg.router_ftp&&cfg.router_ftp.user)||'';
  document.getElementById('ftp_pass').value=(cfg.router_ftp&&cfg.router_ftp.pass)||'';
  document.getElementById('ftp_port').value=(cfg.router_ftp&&cfg.router_ftp.port)||'21';
  if(cfg.features){
   document.getElementById('feat_preview').value=cfg.features.preview?'true':'false';
   document.getElementById('feat_search').value=cfg.features.search?'true':'false';
  }
  document.getElementById('status').innerText='Config loaded';
 }catch(e){document.getElementById('status').innerText='New config - will create';}
 detectTS();
}
async function detectTS(){
 try{
  const r=await fetch('/api/tailscale'); const j=await r.json();
  document.getElementById('tsInfo').innerText=j.ip?('Tailscale: '+j.ip+' ('+j.status+')'):'Tailscale OFF - Banner will be hidden';
  document.getElementById('tsShow').innerText=j.ip?('Detected: '+j.url):'Not connected';
  if(j.ip) document.getElementById('ts_ip').value=j.ip;
 }catch(e){document.getElementById('tsInfo').innerText='Tailscale check failed';}
}
async function save(){
 const nc={
  mobile_path:document.getElementById('mobile_path').value,
  server_mode:document.getElementById('server_mode').value,
  listen_addr:document.getElementById('listen_addr').value||'0.0.0.0',
  listen_port:document.getElementById('listen_port').value||'8080',
  wd_auth:{user:document.getElementById('wd_user').value||'admin',pass:document.getElementById('wd_pass').value||'admin123'},
  router_ftp:{host:document.getElementById('ftp_host').value,user:document.getElementById('ftp_user').value,pass:document.getElementById('ftp_pass').value,port:document.getElementById('ftp_port').value||'21'},
  ui_type:document.getElementById('ui_type').value,
  theme:document.getElementById('theme').value,
  icon_pack:document.getElementById('icon_pack').value,
  features:{preview:document.getElementById('feat_preview').value==='true',search:document.getElementById('feat_search').value==='true',player:true,pdf:true,details:true,right_panel:true}
 };
 document.getElementById('status').innerText='Saving...';
 try{
  const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(nc)});
  if(r.ok){document.getElementById('status').innerText='✅ Saved! Redirecting to / in 2s';setTimeout(()=>{location.href='/';},2000);}
  else{document.getElementById('status').innerText='Save failed';}
 }catch(e){document.getElementById('status').innerText='Error: '+e;}
}
load();
</script>
</body>
</html>
